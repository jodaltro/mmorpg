<!doctype html><meta charset="utf-8"><title>B8 — revisão temporal</title>
<style>body{background:#202730;color:#eee;font:16px sans-serif}canvas{image-rendering:pixelated;width:96px;height:96px}button,select{font-size:16px;margin:8px}section>div{width:96px}canvas{display:block}section{display:flex;gap:12px;flex-wrap:wrap}h1{font-size:22px}</style>
<h1>B8 R2 — protótipo rejeitado / revisão de movimento</h1>
<p>Velocidade nativa: ciclo 240 ms; B7: 480 ms. Sem interpolação. A câmera não comprova foot lock.</p>
<button id="play">Reproduzir dois ciclos</button><button id="loop">Repetir para inspeção</button><button id="pause">Pausar</button>
<label>Velocidade <select id="speed"><option value="1">1× nativa</option value="0.25">0,25× diagnóstico</option></select></label>
<p id="state">Parado</p><section><div>B7<canvas id="old" width="96" height="96"></canvas></div><div>B8 R2<canvas id="new" width="96" height="96"></canvas></div><div>B8 nativo<canvas id="native" style="width:96px;height:96px" width="96" height="96"></canvas></div></section>
<script>
const load=p=>{let i=new Image();i.src=p;return i};const b8=Array.from({length:8},(_,i)=>load(`frames-r2/frame_${String(i).padStart(3,'0')}.png`));const b7=Array.from({length:4},(_,i)=>load(`../../Aseprite/HeroB7/walk-r2/frame_${String(i).padStart(3,'0')}.png`));
let running=false,infinite=false,t=0,last=0;function draw(id,im){let c=document.getElementById(id).getContext('2d');c.clearRect(0,0,96,96);if(im.complete)c.drawImage(im,0,0)}
function tick(now){if(running){t+=(now-last)*Number(speed.value);if(!infinite&&t>=480){t=479.99;running=false}}last=now;let f=Math.floor(t/30)%8;draw('old',b7[Math.floor(t/120)%4]);draw('new',b8[f]);draw('native',b8[f]);state.textContent=`${running?'Reproduzindo':'Parado'} | tempo ${Math.floor(t)} ms | frame ${f} | ciclos ${Math.floor(t/240)}`;requestAnimationFrame(tick)}
play.onclick=()=>{t=0;infinite=false;running=true};loop.onclick=()=>{t=0;infinite=true;running=true};pause.onclick=()=>running=false;requestAnimationFrame(tick);
</script>
