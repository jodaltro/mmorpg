; Combat moves of the Valdoria demo (WorldSim plugin, UWorldSimSettings::Moves).
; Applied to the project's Config/DefaultGame.ini by configure-game.ps1
; (called by sync-plugin.ps1, so build.ps1 and play.ps1 keep it current).
; Montages come from tools/unreal/retarget-combat.py (Paragon -> player skeleton);
; effects from Epic's Niagara Examples pack. RequiresSkill = a skill id of the
; universe: stronger moves unlock only after the world teaches them.
