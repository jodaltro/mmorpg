<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
		<meta name="theme-color" content="#02050f">
		<meta name="color-scheme" content="dark">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="Hospedeiro">
		<meta name="description" content="Um MMORPG dentro de um corpo humano. Você é uma célula.">
		<title>$GODOT_PROJECT_NAME</title>
		<link rel="manifest" href="manifest.webmanifest">
		<style>
			html, body {
				margin: 0;
				padding: 0;
				border: 0;
				width: 100%;
				height: 100%;
				position: fixed;
				inset: 0;
				overflow: hidden;
				background: #02050f;
				color: #cfe7ff;
				font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				overscroll-behavior: none;
				touch-action: none;
				-webkit-user-select: none;
				user-select: none;
				-webkit-touch-callout: none;
				-webkit-tap-highlight-color: transparent;
			}
			#canvas {
				display: block;
				width: 100%;
				height: 100%;
				outline: none;
			}
			#loader {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 14px;
				background: radial-gradient(circle at 50% 45%, #0a1c3a 0%, #02050f 70%);
				z-index: 5;
			}
			#loader .cell {
				width: 74px;
				height: 74px;
				border-radius: 50%;
				background: radial-gradient(circle at 50% 50%, #7ff3ff 0 9%, #1f6fc4 10% 38%, #0b2f66 39% 70%, transparent 72%);
				box-shadow: 0 0 40px 8px rgba(70, 190, 255, .35);
				animation: breathe 2.4s ease-in-out infinite;
			}
			@keyframes breathe { 50% { transform: scale(1.12); box-shadow: 0 0 56px 14px rgba(70, 190, 255, .5); } }
			#loader h1 { margin: 0; font-size: 22px; letter-spacing: .32em; font-weight: 600; color: #5fd4ff; }
			#loader p { margin: 0; font-size: 13px; color: #7f97b3; text-align: center; padding: 0 24px; max-width: 460px; }
			#bar { width: min(60vw, 320px); height: 4px; border-radius: 2px; background: rgba(120, 170, 230, .18); overflow: hidden; }
			#bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #35d6ff, #6cffc4); transition: width .2s; }
			#notice { display: none; background: #3a1c28; border: 1px solid #a3445c; border-radius: 10px; padding: 14px 18px; max-width: 460px; margin: 0 24px; font-size: 14px; line-height: 1.45; text-align: center; white-space: pre-line; color: #ffd9e0; }
			#rotate {
				display: none;
				position: fixed;
				inset: 0;
				z-index: 9;
				background: #02050f;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 18px;
				text-align: center;
				padding: 24px;
				font-size: 17px;
			}
			#rotate svg { width: 84px; height: 84px; animation: turn 2.6s ease-in-out infinite; }
			@keyframes turn { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
			@media (orientation: portrait) and (pointer: coarse) and (max-width: 600px) {
				#rotate { display: flex; }
			}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png">
		<link rel="apple-touch-icon" href="index.apple-touch-icon.png">
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">Seu navegador não suporta canvas.</canvas>
		<noscript>Este jogo precisa de JavaScript.</noscript>

		<div id="loader">
			<div class="cell"></div>
			<h1>HOSPEDEIRO</h1>
			<div id="bar"><i id="fill"></i></div>
			<p id="hint">Entrando no corpo… na primeira vez o jogo baixa uns 9 MB; nas próximas abre na hora.</p>
			<div id="notice"></div>
		</div>

		<div id="rotate">
			<svg viewBox="0 0 64 64" fill="none" stroke="#5fd4ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="6" width="24" height="42" rx="4"/><path d="M30 42h4"/><path d="M12 54c6 6 14 6 20 4M52 54c-6 6-14 6-20 4" opacity=".5"/></svg>
			<div>Gire o aparelho para jogar<br><small style="color:#7f97b3">O Hospedeiro é jogado na horizontal.</small></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
// A phone's screen has three physical pixels per CSS pixel; the game's glow fills it edge to edge, so those extra pixels cost far
// more than they show. The canvas is drawn at most at 2x (?dpr=3 to see the difference).
(function () {
	const real = window.devicePixelRatio || 1;
	const wanted = parseFloat(new URLSearchParams(location.search).get('dpr')) || 2;
	Object.defineProperty(window, 'devicePixelRatio', { get: () => Math.min(real, wanted), configurable: true });
}());
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const loader = document.getElementById('loader');
	const fill = document.getElementById('fill');
	const notice = document.getElementById('notice');
	const hint = document.getElementById('hint');

	document.addEventListener('contextmenu', (e) => e.preventDefault());
	['gesturestart', 'gesturechange', 'gestureend'].forEach((n) => document.addEventListener(n, (e) => e.preventDefault()));

	// A phone that dims or locks its screen in the middle of a fight loses the fight: keep it awake while the game is open.
	let wake = null;
	async function keepAwake() {
		try {
			if ('wakeLock' in navigator && document.visibilityState === 'visible' && !wake) {
				wake = await navigator.wakeLock.request('screen');
				wake.addEventListener('release', () => { wake = null; });
			}
		} catch (err) { /* not allowed right now */ }
	}
	document.addEventListener('visibilitychange', keepAwake);
	window.addEventListener('pointerdown', () => {
		keepAwake();
		if (matchMedia('(pointer: coarse)').matches && screen.orientation && screen.orientation.lock && document.fullscreenElement) {
			screen.orientation.lock('landscape').catch(() => {});
		}
	}, { passive: true });

	function fail(message) {
		fill.parentElement.style.display = 'none';
		hint.style.display = 'none';
		notice.style.display = 'block';
		notice.textContent = message;
		loader.style.display = 'flex';
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('Este navegador não consegue rodar o jogo.\nFalta: ' + missing.join(', ') + '.\nTente a versão mais recente do Chrome, Edge, Firefox ou Safari.');
		return;
	}
	engine.startGame({
		onProgress(current, total) {
			if (current > 0 && total > 0) {
				fill.style.width = Math.min(100, Math.round(100 * current / total)) + '%';
			}
		},
	}).then(() => {
		if (new URLSearchParams(location.search).get('engine') === 'off') window.__hospedeiroReady = true;
        hint.textContent = 'Preparando sua célula, o mundo e seus habitantes…';
        fill.style.width = '100%';
        const started = Date.now();
        let offeredOffline = false;
        const ready = setInterval(() => {
            if (window.__hospedeiroReady) {
                clearInterval(ready);
                loader.remove();
            } else if (Date.now() - started > 20000 && !offeredOffline) {
                offeredOffline = true;
                hint.textContent = 'O mundo está demorando para responder. Você pode tentar de novo ou jogar offline enquanto reconectamos.';
                const actions = document.createElement('div');
                for (const [text, action] of [['Tentar novamente', () => location.reload()], ['Jogar offline', () => { clearInterval(ready); loader.remove(); }]]) {
                    const button = document.createElement('button');
                    button.textContent = text;
                    button.style.cssText = 'background:#12283c;color:#cfe7ff;border:1px solid #3e7188;border-radius:8px;padding:12px 18px;margin:6px;font:inherit;cursor:pointer';
                    button.onclick = action;
                    actions.appendChild(button);
                }
                loader.appendChild(actions);
            }
        }, 100);
	}, (err) => {
		console.error(err);
		fail('O jogo não conseguiu abrir.\n' + (err && err.message ? err.message : String(err)));
	});
}());
		</script>
	</body>
</html>
